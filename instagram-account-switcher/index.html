<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Instagram Account Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <div id="accountList"></div>
    <button id="addBtn" title="Добавить аккаунт">+</button>
    <button id="poolBtn" title="Пул клиентов">🔗</button>
  </div>

  <div id="topbar">
    <span id="activeLabel"></span>
    <button id="reloadBtn" title="Обновить страницу (если зависла загрузка)">🔄</button>
    <button id="mobileToggleBtn" title="Мобильный вид (как Toggle device toolbar в DevTools)">
      📱 Мобильный вид
    </button>
    <button id="emulatorBtn" title="Открыть настоящее приложение Instagram в LDPlayer">
      📲 В приложении
    </button>
    <button id="emulatorQuitBtn" title="Закрыть инстанс LDPlayer этого аккаунта, освободить память">
      ✅ Завершить моб.версию
    </button>
  </div>

  <div id="ctxMenu" class="ctx-menu" hidden>
    <div class="ctx-item" id="ctxPin"></div>
    <div class="ctx-item" id="ctxLdIndex">📲 Номер инстанса LDPlayer…</div>
    <div class="ctx-item ctx-danger" id="ctxDelete">🗑 Удалить</div>
  </div>

  <div id="ldIndexModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-title">Номер инстанса LDPlayer</div>
      <input id="ldIndexInput" type="number" min="0" placeholder="Например: 0" />
      <div class="row">
        <button id="ldIndexSaveBtn" class="primary">Сохранить</button>
        <button id="ldIndexClearBtn">Снять привязку</button>
        <button id="ldIndexCancelBtn">Отмена</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
