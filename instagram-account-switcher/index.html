<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Instagram Account Switcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sidebar">
    <div id="accountList"></div>
    <button id="addBtn" title="Добавить аккаунт">+</button>
    <button id="poolBtn" title="Пул клиентов">🔗</button>
  </div>

  <div id="topbar">
    <span id="activeLabel"></span>
    <button id="reloadBtn" title="Обновить страницу (если зависла загрузка)">🔄</button>
    <button id="mobileToggleBtn" title="Мобильный вид (как Toggle device toolbar в DevTools)">
      📱 Мобильный вид
    </button>
  </div>

  <div id="ctxMenu" class="ctx-menu" hidden>
    <div class="ctx-item" id="ctxPin"></div>
    <div class="ctx-item ctx-danger" id="ctxDelete">🗑 Удалить</div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
